name: Deploy to Railway
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (Railway CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy a2a-meta-clones
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Account token works with CLI; project tokens often fail whoami/up.
          export RAILWAY_TOKEN="${RAILWAY_API_TOKEN:-${RAILWAY_PROJECT_TOKEN:-}}"
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "Set GitHub secret RAILWAY_API_TOKEN (account token) or RAILWAY_TOKEN" >&2
            exit 1
          fi
          if [ -n "${RAILWAY_PROJECT_ID:-}" ]; then
            railway link --project "$RAILWAY_PROJECT_ID" --environment production || true
          fi
          railway up --service a2a-meta-clones --detach
          railway up --service a2a-meta-clones-slot-2 --detach
