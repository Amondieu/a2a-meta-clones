[project]
name = "a2a-meta-clones"
version = "0.1.0"
description = "Deployable MCP clone services for A2A-Meta. Orchestrated by Amondieu/A2A-Meta."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Amondieu", email = "amonmaly_33@gmx.at"},
]
keywords = ["mcp", "agent", "compliance", "eu-ai-act", "a2a-meta"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.urls]
"A2A-Meta" = "https://github.com/Amondieu/A2A-Meta"
"Spec" = "https://github.com/Amondieu/A2A-Meta/blob/master/docs/clone_repo_architecture_v0_DRAFT.md"
"Plan" = "https://github.com/Amondieu/A2A-Meta/blob/master/docs/a2a_meta_clones_v1_implementation_plan_v0_DRAFT.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
