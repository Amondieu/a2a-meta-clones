# slot-b railway.toml (per-slot override)
# Overrides the shared template at /railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "../../Dockerfile"

[deploy]
startCommand = "uvicorn services.shared.multiplexer.app:app --host 0.0.0.0 --port 8080"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway Variables (set in dashboard):
# ROOT_DIRECTORY=services/slot-b
