# Shared railway.toml template.
# Per-slot overrides live in services/slot-{a,b,c}/railway.toml
# and set ROOT_DIRECTORY to that slot.

[build]
builder = "DOCKERFILE"
dockerfilePath = "../../Dockerfile"

[deploy]
startCommand = "uvicorn services.shared.multiplexer.app:app --host 0.0.0.0 --port 8080"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
